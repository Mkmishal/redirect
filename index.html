<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arts Fest - Redirecting...</title>
    <style>
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f8fafc;
            color: #334155;
        }
        .container {
            text-align: center;
        }
        .spinner {
            border: 4px solid rgba(192, 132, 252, 0.2);
            border-top: 4px solid #c084fc; /* Matches your Django stage single color */
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 16px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        h2 {
            margin: 0 0 8px 0;
            font-size: 1.25rem;
            color: #1e293b;
        }
        p {
            margin: 0;
            font-size: 0.9rem;
            color: #64748b;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="spinner"></div>
        <h2>Taking you to the Arts Fest portal...</h2>
        <p>Connecting to the live server.</p>
    </div>
</body>
</html>
